<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ClickCart – mock e‑commerce</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">
    <i class="fas fa-hand-pointer"></i>
    <span>ClickCart</span>
  </div>
  <button id="cart-icon" class="cart-icon-btn">
    <i class="fas fa-shopping-cart"></i>
    <span id="cart-count" class="cart-badge">0</span>
  </button>
</header>

<main>
  <div class="container">
    <div class="categories-bar">
      <button class="category-btn active" data-category="all">All</button>
      <button class="category-btn" data-category="men">Men</button>
      <button class="category-btn" data-category="women">Women</button>
      <button class="category-btn" data-category="accessories">Accessories</button>
    </div>
    <div id="products-grid" class="products-grid"></div>
  </div>
</main>

<div id="cart-overlay" class="cart-overlay"></div>
<aside id="cart-drawer" class="cart-drawer">
  <div class="cart-header">
    <h2>Your Cart</h2>
    <button id="close-cart" class="close-cart"><i class="fas fa-times"></i></button>
  </div>
  <div id="cart-items-container" class="cart-items">
    <div class="empty-cart-msg">Cart is empty 🛒</div>
  </div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total:</span>
      <span id="cart-total-price">$0.00</span>
    </div>
    <button id="checkout-btn" class="checkout-btn">Proceed to Checkout</button>
    <small class="mock-note">* mock checkout – frontend demo only</small>
  </div>
</aside>

<script src="script.js"></script>
</body>
</html>
